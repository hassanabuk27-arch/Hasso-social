
<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HASSO - Connect. Share. Belong.</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;color:#222}
header{background:#1877f2;color:white;padding:16px;text-align:center;font-size:25px;font-weight:bold}
main{max-width:600px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#1877f2;color:white;border:0;padding:12px 18px;border-radius:8px;font-size:16px;cursor:pointer;margin:5px 0}
button:disabled{opacity:.6}
.secondary{background:#555}
.hidden{display:none}
.post{border-bottom:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}
small{color:#666}
#message{color:#d00;margin:10px 0}
</style>
</head>
<body>

<header>HASSO</header>

<main>
<section id="authSection" class="card">
<h2>Welcome to HASSO</h2>
<p>Connect. Share. Belong.</p>

<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">

<button id="loginBtn">Login</button>
<button id="registerBtn" class="secondary">Create Account</button>
<p id="message"></p>
</section>

<section id="appSection" class="hidden">
<div class="card">
<h3 id="welcome"></h3>
<button id="logoutBtn" class="secondary">Logout</button>
</div>

<div class="card">
<h3>Create a post</h3>
<textarea id="postText" rows="4" placeholder="What's on your mind?"></textarea>
<button id="postBtn">Publish Post</button>
<p id="postMessage"></p>
</div>

<div class="card">
<h3>News Feed</h3>
<div id="feed">Loading posts...</div>
</div>
</section>
</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCEYjoHliRW1jE1hgu-33QxZmsBYVc25jk",
authDomain: "hasso-4bc9e.firebaseapp.com",
projectId: "hasso-4bc9e",
storageBucket: "hasso-4bc9e.firebasestorage.app",
messagingSenderId: "150032029282",
appId: "1:150032029282:web:3d790c6d4ae68b3f50a33b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const el = id => document.getElementById(id);

el("loginBtn").addEventListener("click", async () => {
const email = el("email").value.trim();
const password = el("password").value;

el("message").textContent = "";

if (!email || !password) {
el("message").textContent = "Enter your email and password.";
return;
}

el("loginBtn").disabled = true;

try {
await signInWithEmailAndPassword(auth, email, password);
} catch (error) {
el("message").textContent = error.code === "auth/invalid-credential"
? "Email or password is incorrect. Try again."
: error.message;
} finally {
el("loginBtn").disabled = false;
}
});

el("registerBtn").addEventListener("click", async () => {
const email = el("email").value.trim();
const password = el("password").value;

el("message").textContent = "";

if (!email || !password) {
el("message").textContent = "Enter your email and password.";
return;
}

if (password.length < 6) {
el("message").textContent = "Password must be at least 6 characters.";
return;
}

el("registerBtn").disabled = true;

try {
await createUserWithEmailAndPassword(auth, email, password);
} catch (error) {
el("message").textContent = error.message;
} finally {
el("registerBtn").disabled = false;
}
});

el("logoutBtn").addEventListener("click", async () => {
await signOut(auth);
});

onAuthStateChanged(auth, user => {
if (user) {
el("authSection").classList.add("hidden");
el("appSection").classList.remove("hidden");
el("welcome").textContent = "Welcome, " + user.email;
loadFeed();
} else {
el("authSection").classList.remove("hidden");
el("appSection").classList.add("hidden");
}
});

el("postBtn").addEventListener("click", async () => {
const user = auth.currentUser;
const text = el("postText").value.trim();

if (!user || !text) {
el("postMessage").textContent = "Write something first.";
return;
}

el("postBtn").disabled = true;

try {
await addDoc(collection(db, "posts"), {
text: text,
email: user.email,
uid: user.uid,
createdAt: serverTimestamp()
});

el("postText").value = "";
el("postMessage").textContent = "Post published!";
} catch (error) {
el("postMessage").textContent = "Could not publish: " + error.message;
} finally {
el("postBtn").disabled = false;
}
});

let feedStarted = false;

function loadFeed() {
if (feedStarted) return;
feedStarted = true;

const postsQuery = query(
collection(db, "posts"),
orderBy("createdAt", "desc")
);

onSnapshot(postsQuery, snapshot => {
const feed = el("feed");
feed.innerHTML = "";

if (snapshot.empty) {
feed.textContent = "No posts yet. Be the first to post!";
return;
}

snapshot.forEach(document => {
const data = document.data();

const post = document.createElement("div");
post.className = "post";

const author = document.createElement("strong");
author.textContent = data.email || "HASSO User";

const content = document.createElement("p");
content.textContent = data.text || "";

post.appendChild(author);
post.appendChild(content);
feed.appendChild(post);
});

}, error => {
el("feed").textContent = "Feed error: " + error.message;
});
}
</script>

</body>
</html>
