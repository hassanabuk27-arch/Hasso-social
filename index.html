
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HASSO - Connect. Share. Belong.</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f3f8;font-family:Arial;color:#222}
header{background:#102b59;color:white;text-align:center;padding:20px}
main{max-width:600px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:18px}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
textarea{min-height:100px}
button{padding:12px;background:#1769d2;color:white;border:0;border-radius:8px;cursor:pointer;margin:5px 0}
.full{width:100%}
.post{padding:15px 0;border-bottom:1px solid #ddd}
.post p{white-space:pre-wrap;overflow-wrap:anywhere}
.small{font-size:12px;color:#777}
#dashboard{display:none}
#message,#postMessage{color:#b00020}
</style>
</head>
<body>

<header>
<h1>HASSO</h1>
<p>Connect. Share. Belong.</p>
</header>

<main>
<div id="auth" class="card">
<h2>Welcome to HASSO</h2>
<input id="name" placeholder="Full name">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="full" id="register">Create Account</button>
<button class="full" id="login">Login</button>
<p id="message"></p>
</div>

<div id="dashboard">
<div class="card">
<h2>Welcome to HASSO!</h2>
<p id="userEmail"></p>
<button id="logout">Logout</button>
</div>

<div class="card">
<h2>Create a Post</h2>
<textarea id="postContent" maxlength="2000" placeholder="What's on your mind?"></textarea>
<button class="full" id="publish">Publish Post</button>
<p id="postMessage"></p>
</div>

<div class="card">
<h2>News Feed</h2>
<div id="feed">Loading posts...</div>
</div>
</div>
</main>

<footer style="text-align:center;padding:20px;color:#777">
© 2026 HASSO
</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,onAuthStateChanged,
signOut,updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,collection,addDoc,
onSnapshot,serverTimestamp,doc,
getDoc,getDocs,setDoc,deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCEYjoHliRW1jE1hgu-33QxZmsBYVc25jk",
authDomain: "hasso-4bc9e.firebaseapp.com",
projectId: "hasso-4bc9e",
storageBucket: "hasso-4bc9e.firebasestorage.app",
messagingSenderId: "150032029282",
appId: "1:150032029282:web:3d790c6d4ae68b3f50a33b"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const el=id=>document.getElementById(id);

el("register").onclick=async()=>{
try{
const name=el("name").value.trim();
const email=el("email").value.trim();
const password=el("password").value;
if(!name||!email||password.length<6){
el("message").textContent="Enter your name, email and password (at least 6 characters).";
return;
}
const result=await createUserWithEmailAndPassword(auth,email,password);
await updateProfile(result.user,{displayName:name});
}catch(e){el("message").textContent=e.message;}
};

el("login").onclick=async()=>{
try{
await signInWithEmailAndPassword(auth,
el("email").value.trim(),el("password").value);
}catch(e){el("message").textContent=e.message;}
};

el("logout").onclick=()=>signOut(auth);

el("publish").onclick=async()=>{
const user=auth.currentUser;
const content=el("postContent").value.trim();
if(!content)return;
el("publish").disabled=true;
try{
await addDoc(collection(db,"posts"),{
content,
userName:user.displayName||user.email,
uid:user.uid,
createdAt:serverTimestamp()
});
el("postContent").value="";
el("postMessage").textContent="Post published!";
}catch(e){el("postMessage").textContent=e.message;}
finally{el("publish").disabled=false;}
};

let stopFeed=null;

onAuthStateChanged(auth,user=>{
if(stopFeed){stopFeed();stopFeed=null;}

if(!user){
el("auth").style.display="block";
el("dashboard").style.display="none";
return;
}

el("auth").style.display="none";
el("dashboard").style.display="block";
el("userEmail").textContent=user.displayName||user.email;

stopFeed=onSnapshot(collection(db,"posts"),snapshot=>{
const feed=el("feed");
feed.replaceChildren();

const posts=snapshot.docs.map(d=>({id:d.id,...d.data()}));
posts.sort((a,b)=>{
const ta=a.createdAt?.toMillis?.()||0;
const tb=b.createdAt?.toMillis?.()||0;
return tb-ta;
});

if(posts.length===0){
feed.textContent="No posts yet. Be the first to post!";
return;
}

posts.forEach(post=>{
const article=document.createElement("div");
article.className="post";

const author=document.createElement("strong");
author.textContent=post.userName||"HASSO User";

const content=document.createElement("p");
content.textContent=post.content||"";

const date=document.createElement("div");
date.className="small";
date.textContent=post.createdAt?.toDate
?post.createdAt.toDate().toLocaleString()
:"Post";

const likeButton=document.createElement("button");
const likeRef=doc(db,"posts",post.id,"likes",user.uid);
likeButton.textContent="❤️ Like";
likeButton.disabled=true;

getDoc(likeRef).then(s=>{
likeButton.textContent=s.exists()?"❤️ Liked":"❤️ Like";
likeButton.disabled=false;
}).catch(()=>{
likeButton.textContent="Like unavailable";
});

likeButton.onclick=async()=>{
likeButton.disabled=true;
try{
const s=await getDoc(likeRef);
if(s.exists()){
await deleteDoc(likeRef);
likeButton.textContent="❤️ Like";
}else{
await setDoc(likeRef,{
uid:user.uid,
createdAt:serverTimestamp()
});
likeButton.textContent="❤️ Liked";
}
}catch(e){
alert("Like error: "+e.message);
}finally{
likeButton.disabled=false;
}
};

article.append(author,content,date,likeButton);
  
const commentBox = document.createElement("div");
const commentTitle = document.createElement("strong");
commentTitle.textContent = "💬 Comments";

const commentList = document.createElement("div");
const commentInput = document.createElement("input");
commentInput.placeholder = "Write a comment...";

const commentButton = document.createElement("button");
commentButton.textContent = "Send Comment";

commentBox.append(commentTitle, commentList, commentInput, commentButton);
article.appendChild(commentBox);

async function loadComments() {
  const result = await getDocs(
    collection(db, "posts", post.id, "comments")
  );

  commentList.replaceChildren();

  result.forEach(item => {
    const data = item.data();
    const line = document.createElement("p");
    line.textContent = (data.userName || "User") + ": " + data.text;
    commentList.appendChild(line);
  });
}

loadComments();

commentButton.onclick = async () => {
  const text = commentInput.value.trim();
  if (!text) return;

  commentButton.disabled = true;

  try {
    await addDoc(
      collection(db, "posts", post.id, "comments"),
      {
        uid: user.uid,
        userName: user.displayName || user.email,
        text: text,
        createdAt: serverTimestamp()
      }
    );

    commentInput.value = "";
    await loadComments();
  } catch (error) {
    alert("Comment error: " + error.message);
  } finally {
    commentButton.disabled = false;
  }
};
  
feed.appendChild(article);
});
},error=>{
el("feed").textContent="Error loading posts: "+error.message;
});
});
</script>
</body>
</html>
