
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1877f2">
<link rel="manifest" href="./manifest.json">
<title>HASSO - Social Network</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#1c1e21}
header{background:#1877f2;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
header h1{font-size:25px}
nav{display:flex;gap:5px;overflow-x:auto;background:white;padding:10px;position:sticky;top:55px;z-index:19}
button{background:#1877f2;color:white;border:0;padding:10px 14px;border-radius:8px;margin:3px;cursor:pointer}
nav button{white-space:nowrap}
.container{max-width:850px;margin:15px auto;padding:10px}
.card,.post{background:white;padding:15px;margin-bottom:14px;border-radius:12px;box-shadow:0 1px 4px #ccc}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
textarea{min-height:85px;resize:vertical}
.hidden{display:none!important}
.profile-photo{width:85px;height:85px;border-radius:50%;object-fit:cover}
.post img{max-width:100%;border-radius:10px;margin-top:10px}
.small{font-size:13px;color:#65676b}
.post-actions{display:flex;flex-wrap:wrap;align-items:center;margin-top:10px}
.message{background:#e7f3ff;padding:10px;margin:7px;border-radius:10px}
#messageList{max-height:350px;overflow-y:auto}
.story-card{display:inline-block;vertical-align:top;width:160px;min-height:130px;margin:5px;padding:12px;background:#e7f3ff;border-radius:12px}
.status{padding:10px;color:#1877f2}
@media(max-width:600px){.container{padding:7px}header h1{font-size:22px}}
</style>
</head>

<body>
<header>
  <h1>HASSO</h1>
  <span id="headerUser">Welcome</span>
</header>

<nav id="mainNav" class="hidden">
  <button data-tab="news">News Feed</button>
  <button data-tab="stories">Stories</button>
  <button data-tab="people">People</button>
  <button data-tab="messages">Messages</button>
  <button data-tab="notifications">Notifications</button>
  <button data-tab="search">Search</button>
  <button data-tab="profile">Profile</button>
  <button data-tab="verification">Verification</button>
  <button data-tab="admin">Admin</button>
</nav>

<div class="container">

<section id="authSection" class="card">
  <h2>Welcome to HASSO</h2>
  <p>Create an account or login.</p>
  <input id="regName" placeholder="Full name">
  <input id="regEmail" type="email" placeholder="Email address">
  <input id="regPassword" type="password" placeholder="Password">
  <button id="registerBtn">Create Account</button>
  <hr style="margin:15px 0">
  <input id="loginEmail" type="email" placeholder="Email address">
  <input id="loginPassword" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <p id="authMessage" class="status"></p>
</section>

<section id="news" class="tab card hidden">
  <h2>News Feed</h2>
  <textarea id="postText" placeholder="What's on your mind?"></textarea>
  <input id="postImage" placeholder="Image URL (optional)">
  <button id="publishPost">Publish Post</button>
  <div id="feedList"></div>
</section>

<section id="stories" class="tab card hidden">
  <h2>HASSO Stories</h2>
  <textarea id="storyText" placeholder="Write your story..."></textarea>
  <input id="storyImage" placeholder="Story image URL (optional)">
  <button id="publishStory">Share Story</button>
  <h3>Recent Stories</h3>
  <div id="storyList"></div>
</section>

<section id="people" class="tab card hidden">
  <h2>People</h2>
  <input id="peopleSearch" placeholder="Search people...">
  <div id="peopleList"></div>
</section>

<section id="messages" class="tab card hidden">
  <h2>Private Messages</h2>
  <div id="chatList"></div>
  <h3 id="chatTitle">Choose a person</h3>
  <div id="messageList"></div>
  <textarea id="messageText" placeholder="Write a message..."></textarea>
  <button id="sendMessage">Send Message</button>
</section>

<section id="notifications" class="tab card hidden">
  <h2>Notifications</h2>
  <div id="notificationList"></div>
</section>

<section id="search" class="tab card hidden">
  <h2>Search HASSO</h2>
  <input id="searchInput" placeholder="Search people and posts...">
  <div id="searchResults"></div>
</section>

<section id="profile" class="tab card hidden">
  <h2>My Profile</h2>
  <img id="profilePhoto" class="profile-photo"
       src="https://placehold.co/100x100" alt="Profile">
  <h3 id="profileName">User</h3>
  <p id="profileEmail" class="small"></p>
  <p id="profileStats"></p>
  <input id="editName" placeholder="Your name">
  <input id="editPhoto" placeholder="Profile photo URL">
  <button id="saveProfile">Save Profile</button>
  <button id="logoutBtn">Logout</button>
</section>

<section id="verification" class="tab card hidden">
  <h2>Account Verification</h2>
  <textarea id="verificationReason" placeholder="Why are you requesting verification?"></textarea>
  <button id="requestVerification">Submit Request</button>
</section>

<section id="admin" class="tab card hidden">
  <h2>HASSO Admin Dashboard</h2>
  <div id="adminContent"></div>
</section>

</div>

<script type="module">
  
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp,
  updateDoc,
  deleteDoc,
  where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEYjoHliRW1jE1hgu-33QxZmsBYVc25jk",
  authDomain: "hasso-4bc9e.firebaseapp.com",
  projectId: "hasso-4bc9e",
  storageBucket: "hasso-4bc9e.firebasestorage.app",
  messagingSenderId: "150032029282",
  appId: "1:150032029282:web:3d790c6d4ae68b3f50a33b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let currentUser = null;
let currentProfile = null;
let activeChat = null;

let stopFeed = null;
let stopStories = null;
let stopNotifications = null;
let stopMessages = null;

function notify(message) {
  alert(message);
}

function validUrl(value) {
  try {
    const url = new URL(value);
    return ["http:", "https:"].includes(url.protocol)
      ? url.href : "";
  } catch {
    return "";
  }
}

// NAVIGATION
function showTab(tabId) {
  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.add("hidden");
  });

  $(tabId).classList.remove("hidden");

  if (tabId === "news") loadFeed();
  if (tabId === "stories") loadStories();
  if (tabId === "people") loadPeople();
  if (tabId === "notifications") loadNotifications();
  if (tabId === "messages") loadChats();
  if (tabId === "profile") loadProfileStats();
}

document.querySelectorAll("#mainNav button").forEach(button => {
  button.onclick = async () => {
    const tab = button.dataset.tab;

    if (tab === "admin") {
      const adminSnap = await getDoc(
        doc(db, "admins", currentUser.uid)
      );

      if (!adminSnap.exists() ||
          adminSnap.data().role !== "admin") {
        return notify("Admin access only.");
      }
    }

    showTab(tab);
  };
});

// REGISTER
$("registerBtn").onclick = async () => {
  const name = $("regName").value.trim();
  const email = $("regEmail").value.trim();
  const password = $("regPassword").value;

  if (!name || !email || !password) {
    return notify("Please fill in all fields.");
  }

  if (password.length < 6) {
    return notify("Password must have at least 6 characters.");
  }

  try {
    const result = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await setDoc(doc(db, "users", result.user.uid), {
      uid: result.user.uid,
      name,
      email,
      photoURL: "",
      verified: false,
      createdAt: serverTimestamp()
    });

    notify("Welcome to HASSO! Account created.");
  } catch (error) {
    notify(error.message);
  }
};

// LOGIN
$("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      $("loginEmail").value.trim(),
      $("loginPassword").value
    );
  } catch (error) {
    notify(error.message);
  }
};

// LOAD PROFILE
async function loadProfile() {
  const snap = await getDoc(
    doc(db, "users", currentUser.uid)
  );

  if (!snap.exists()) return;

  currentProfile = snap.data();

  $("headerUser").textContent = currentProfile.name;
  $("profileName").textContent = currentProfile.name;
  $("profileEmail").textContent = currentUser.email;
  $("editName").value = currentProfile.name || "";
  $("editPhoto").value = currentProfile.photoURL || "";

  $("profilePhoto").src =
    validUrl(currentProfile.photoURL) ||
    "https://placehold.co/100x100";

  if (currentProfile.verified) {
    $("profileName").textContent += " ✓";
  }
}

// AUTH STATE
onAuthStateChanged(auth, async user => {
  currentUser = user;

  if (user) {
    try {
      const snap = await getDoc(doc(db, "users", user.uid));

      if (!snap.exists()) {
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          name: user.email,
          email: user.email,
          photoURL: "",
          verified: false,
          createdAt: serverTimestamp()
        });
      }

      await loadProfile();

      $("authSection").classList.add("hidden");
      $("mainNav").classList.remove("hidden");

      showTab("news");
    } catch (error) {
      notify(error.message);
    }
  } else {
    $("authSection").classList.remove("hidden");
    $("mainNav").classList.add("hidden");

    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.add("hidden");
    });

    if (stopFeed) stopFeed();
    if (stopStories) stopStories();
    if (stopNotifications) stopNotifications();
    if (stopMessages) stopMessages();
  }
});

// SAVE PROFILE
$("saveProfile").onclick = async () => {
  const name = $("editName").value.trim();
  const photoURL = validUrl($("editPhoto").value.trim());

  if (!name) return notify("Enter your name.");

  try {
    await updateDoc(doc(db, "users", currentUser.uid), {
      name,
      photoURL
    });

    await loadProfile();
    notify("Profile saved successfully!");
  } catch (error) {
    notify(error.message);
  }
};

// LOGOUT
$("logoutBtn").onclick = async () => {
  await signOut(auth);
};

// PROFILE FOLLOWER STATISTICS
async function loadProfileStats() {
  const followers = await getDocs(
    collection(db, "users", currentUser.uid, "followers")
  );

  const following = await getDocs(
    collection(db, "users", currentUser.uid, "following")
  );

  $("profileStats").textContent =
    followers.size + " Followers · " +
    following.size + " Following";
  }
  // PUBLISH POST
$("publishPost").onclick = async () => {
  const text = $("postText").value.trim();
  const imageURL = validUrl($("postImage").value.trim());

  if (!text && !imageURL) {
    return notify("Write something before publishing.");
  }

  try {
    await addDoc(collection(db, "posts"), {
      uid: currentUser.uid,
      name: currentProfile.name,
      text,
      imageURL,
      likes: [],
      createdAt: serverTimestamp()
    });

    $("postText").value = "";
    $("postImage").value = "";
    notify("Your post is now published!");
  } catch (error) {
    notify(error.message);
  }
};

// LOAD NEWS FEED
function loadFeed() {
  if (stopFeed) stopFeed();

  const box = $("feedList");
  box.textContent = "Loading News Feed...";

  const q = query(
    collection(db, "posts"),
    orderBy("createdAt", "desc"),
    limit(50)
  );

  stopFeed = onSnapshot(q, snapshot => {
    box.innerHTML = "";

    snapshot.forEach(postDoc => {
      const post = postDoc.data();
      const postId = postDoc.id;

      const item = document.createElement("div");
      item.className = "post";

      const name = document.createElement("b");
      name.textContent = post.name || "HASSO User";

      const verified = document.createElement("span");
      verified.textContent = post.verified ? " ✓" : "";

      const content = document.createElement("p");
      content.textContent = post.text || "";

      item.append(name, verified, content);

      const imageURL = validUrl(post.imageURL);

      if (imageURL) {
        const img = document.createElement("img");
        img.src = imageURL;
        img.alt = "Post image";
        item.appendChild(img);
      }

      const actions = document.createElement("div");
      actions.className = "post-actions";

      const likes = post.likes || [];
      const liked = likes.includes(currentUser.uid);

      const likeBtn = document.createElement("button");
      likeBtn.textContent = liked ? "Unlike" : "Like";

      likeBtn.onclick = async () => {
        const updatedLikes = liked
          ? likes.filter(uid => uid !== currentUser.uid)
          : [...likes, currentUser.uid];

        await updateDoc(doc(db, "posts", postId), {
          likes: updatedLikes
        });
      };

      const likeCount = document.createElement("span");
      likeCount.textContent = likes.length + " Likes";

      const commentBtn = document.createElement("button");
      commentBtn.textContent = "Comment";

      commentBtn.onclick = async () => {
        const text = prompt("Write your comment:");

        if (!text || !text.trim()) return;

        await addDoc(
          collection(db, "posts", postId, "comments"),
          {
            uid: currentUser.uid,
            name: currentProfile.name,
            text: text.trim(),
            createdAt: serverTimestamp()
          }
        );

        notify("Comment added!");
      };

      const viewBtn = document.createElement("button");
      viewBtn.textContent = "View Comments";

      const commentsBox = document.createElement("div");

      viewBtn.onclick = async () => {
        commentsBox.innerHTML = "Loading comments...";

        const comments = await getDocs(
          query(
            collection(db, "posts", postId, "comments"),
            orderBy("createdAt", "asc")
          )
        );

        commentsBox.innerHTML = "";

        comments.forEach(commentDoc => {
          const comment = commentDoc.data();
          const line = document.createElement("p");

          line.textContent =
            (comment.name || "User") + ": " +
            (comment.text || "");

          commentsBox.appendChild(line);
        });

        if (!commentsBox.children.length) {
          commentsBox.textContent = "No comments yet.";
        }
      };

      actions.append(likeBtn, likeCount, commentBtn, viewBtn);
      item.append(actions, commentsBox);
      box.appendChild(item);
    });

    if (!box.children.length) {
      box.textContent = "No posts yet. Be the first to post!";
    }
  }, error => {
    box.textContent = error.message;
  });
  }
  // PUBLISH STORY
$("publishStory").onclick = async () => {
  const text = $("storyText").value.trim();
  const imageURL = validUrl($("storyImage").value.trim());

  if (!text && !imageURL) {
    return notify("Write something before sharing.");
  }

  try {
    await addDoc(collection(db, "stories"), {
      uid: currentUser.uid,
      name: currentProfile.name,
      text,
      imageURL,
      createdAt: serverTimestamp()
    });

    $("storyText").value = "";
    $("storyImage").value = "";

    notify("Story shared successfully!");
  } catch (error) {
    notify(error.message);
  }
};

// LOAD STORIES
function loadStories() {
  if (stopStories) stopStories();

  const box = $("storyList");
  box.textContent = "Loading stories...";

  const q = query(
    collection(db, "stories"),
    orderBy("createdAt", "desc"),
    limit(50)
  );

  stopStories = onSnapshot(q, snapshot => {
    box.innerHTML = "";

    snapshot.forEach(storyDoc => {
      const story = storyDoc.data();

      const item = document.createElement("div");
      item.className = "story-card";

      const name = document.createElement("b");
      name.textContent = story.name || "HASSO User";

      const content = document.createElement("p");
      content.textContent = story.text || "";

      item.append(name, content);

      const imageURL = validUrl(story.imageURL);

      if (imageURL) {
        const img = document.createElement("img");
        img.src = imageURL;
        img.alt = "Story image";
        img.style.width = "100%";
        img.style.marginTop = "8px";
        item.appendChild(img);
      }

      box.appendChild(item);
    });

    if (!box.children.length) {
      box.textContent = "No stories yet.";
    }
  }, error => {
    box.textContent = error.message;
  });
}
// LOAD PEOPLE
async function loadPeople() {
  const box = $("peopleList");
  box.textContent = "Loading people...";

  try {
    const users = await getDocs(
      query(collection(db, "users"), limit(100))
    );

    box.innerHTML = "";

    users.forEach(userDoc => {
      const person = userDoc.data();
      const uid = userDoc.id;

      if (uid === currentUser.uid) return;

      const item = document.createElement("div");
      item.className = "card";

      const name = document.createElement("b");
      name.textContent = person.name || "HASSO User";

      const followBtn = document.createElement("button");
      followBtn.textContent = "Loading...";

      const followingRef = doc(
        db, "users", currentUser.uid, "following", uid
      );

      const followerRef = doc(
        db, "users", uid, "followers", currentUser.uid
      );

      const checkFollow = async () => {
        const snap = await getDoc(followingRef);
        followBtn.textContent = snap.exists() ? "Unfollow" : "Follow";
      };

      followBtn.onclick = async () => {
        followBtn.disabled = true;

        try {
          const snap = await getDoc(followingRef);

          if (snap.exists()) {
            await deleteDoc(followingRef);
            await deleteDoc(followerRef);
          } else {
            await setDoc(followingRef, {
              uid,
              name: person.name || "HASSO User",
              createdAt: serverTimestamp()
            });

            await setDoc(followerRef, {
              uid: currentUser.uid,
              name: currentProfile.name,
              createdAt: serverTimestamp()
            });

            await addDoc(
              collection(db, "users", uid, "notifications"),
              {
                text: currentProfile.name + " started following you.",
                from: currentUser.uid,
                createdAt: serverTimestamp(),
                read: false
              }
            );
          }

          await checkFollow();
        } catch (error) {
          notify(error.message);
        }

        followBtn.disabled = false;
      };

      item.append(name, followBtn);
      box.appendChild(item);

      checkFollow();
    });

    if (!box.children.length) {
      box.textContent = "No other users found.";
    }
  } catch (error) {
    box.textContent = error.message;
  }
}

// SEARCH PEOPLE
$("peopleSearch").oninput = async () => {
  const search = $("peopleSearch").value.trim().toLowerCase();

  const users = await getDocs(
    query(collection(db, "users"), limit(100))
  );

  $("peopleList").innerHTML = "";

  users.forEach(userDoc => {
    const person = userDoc.data();

    if (
      userDoc.id !== currentUser.uid &&
      (person.name || "").toLowerCase().includes(search)
    ) {
      const item = document.createElement("div");
      item.className = "card";

      const name = document.createElement("b");
      name.textContent = person.name || "HASSO User";

      item.appendChild(name);
      $("peopleList").appendChild(item);
    }
  });
};
// LOAD NOTIFICATIONS
function loadNotifications() {
  if (stopNotifications) stopNotifications();

  const box = $("notificationList");
  box.textContent = "Loading notifications...";

  const q = query(
    collection(db, "users", currentUser.uid, "notifications"),
    orderBy("createdAt", "desc"),
    limit(50)
  );

  stopNotifications = onSnapshot(q, snapshot => {
    box.innerHTML = "";

    snapshot.forEach(notificationDoc => {
      const data = notificationDoc.data();

      const item = document.createElement("div");
      item.className = "card";

      item.textContent = data.text || "New notification";

      box.appendChild(item);
    });

    if (!box.children.length) {
      box.textContent = "No notifications yet.";
    }
  }, error => {
    box.textContent = error.message;
  });
}
// LOAD CHAT LIST
async function loadChats() {
  const box = $("chatList");
  box.innerHTML = "Loading chats...";

  try {
    const chats = await getDocs(
      collection(db, "users", currentUser.uid, "chats")
    );

    box.innerHTML = "";

    chats.forEach(chatDoc => {
      const data = chatDoc.data();

      const button = document.createElement("button");
      button.textContent = data.name || "HASSO User";

      button.onclick = () => {
        activeChat = chatDoc.id;
        $("chatTitle").textContent = data.name || "Chat";
        loadMessages();
      };

      box.appendChild(button);
    });

    if (!box.children.length) {
      box.textContent = "No chats yet. Open People to connect.";
    }
  } catch (error) {
    box.textContent = error.message;
  }
}

// OPEN MESSAGES
function loadMessages() {
  if (!activeChat) return;

  if (stopMessages) stopMessages();

  const box = $("messageList");
  box.textContent = "Loading messages...";

  const q = query(
    collection(db, "users", currentUser.uid, "chats", activeChat, "messages"),
    orderBy("createdAt", "asc"),
    limit(100)
  );

  stopMessages = onSnapshot(q, snapshot => {
    box.innerHTML = "";

    snapshot.forEach(messageDoc => {
      const data = messageDoc.data();

      const item = document.createElement("div");
      item.className = "message";

      item.textContent =
        (data.name || "User") + ": " + (data.text || "");

      box.appendChild(item);
    });

    box.scrollTop = box.scrollHeight;
  }, error => {
    box.textContent = error.message;
  });
}

// SEND MESSAGE
$("sendMessage").onclick = async () => {
  const text = $("messageText").value.trim();

  if (!activeChat) {
    return notify("Choose a person first.");
  }

  if (!text) return;

  try {
    await addDoc(
      collection(db, "users", currentUser.uid, "chats", activeChat, "messages"),
      {
        uid: currentUser.uid,
        name: currentProfile.name,
        text,
        createdAt: serverTimestamp()
      }
    );

    $("messageText").value = "";
  } catch (error) {
    notify(error.message);
  }
};
// SEARCH HASSO
$("searchInput").oninput = async () => {
  const term = $("searchInput").value.trim().toLowerCase();
  const box = $("searchResults");

  box.innerHTML = "";

  if (!term) return;

  try {
    const users = await getDocs(
      query(collection(db, "users"), limit(100))
    );

    users.forEach(userDoc => {
      const person = userDoc.data();

      if ((person.name || "").toLowerCase().includes(term)) {
        const item = document.createElement("div");
        item.className = "card";
        item.textContent = "Person: " + person.name;
        box.appendChild(item);
      }
    });

    const posts = await getDocs(
      query(collection(db, "posts"), limit(100))
    );

    posts.forEach(postDoc => {
      const post = postDoc.data();

      if ((post.text || "").toLowerCase().includes(term)) {
        const item = document.createElement("div");
        item.className = "card";
        item.textContent =
          "Post by " + (post.name || "User") + ": " + post.text;

        box.appendChild(item);
      }
    });

    if (!box.children.length) {
      box.textContent = "No results found.";
    }
  } catch (error) {
    box.textContent = error.message;
  }
};
