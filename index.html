
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASSO - Social Network</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#222}
header{background:#1877f2;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:25px}
main{max-width:850px;margin:20px auto;padding:12px}
section{background:white;padding:18px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
input,textarea,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:7px;font-size:15px}
button{background:#1877f2;color:white;border:0;cursor:pointer;font-weight:bold}
button:hover{opacity:.9}
button.secondary{background:#555}
button.danger{background:#d93025}
.hidden{display:none!important}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:15px}
.tabs button{font-size:13px;padding:10px 4px}
.post{border-bottom:1px solid #eee;padding:15px 0}
.post img{max-width:100%;border-radius:10px}
.avatar{width:45px;height:45px;border-radius:50%;object-fit:cover}
.user-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.user-row div{flex:1}
small{color:#777}
h2{margin-bottom:12px}
h3{margin:8px 0}
.badge{color:#1877f2;font-weight:bold}
textarea{min-height:85px;resize:vertical}
#profileView{display:none}
@media(max-width:600px){
main{margin:8px auto;padding:8px}
.tabs{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header>
<h1>HASSO</h1>
<button id="logoutBtn" class="hidden" style="width:auto">Logout</button>
</header>

<main>

<!-- AUTHENTICATION -->
<section id="auth">
<h2>Welcome to HASSO</h2>
<p>Create an account or log in.</p>
<input id="name" placeholder="Full name">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button id="registerBtn">Create Account</button>
<button id="loginBtn" class="secondary">Login</button>
<p id="authMessage"></p>
</section>

<!-- MAIN APP -->
<div id="app" class="hidden">

<section>
<h2 id="welcome">Welcome</h2>
<p id="myEmail"></p>
<input id="newName" placeholder="Update your name">
<input id="photoUrl" placeholder="Profile photo URL">
<button id="saveProfile">Save Profile</button>
</section>

<!-- NAVIGATION -->
<div class="tabs">
<button data-tab="feed">Feed</button>
<button data-tab="people">People</button>
<button data-tab="search">Search</button>
<button data-tab="notifications">Notifications</button>
<button data-tab="messages">Messages</button>
<button data-tab="admin">Admin</button>
</div>

<!-- FEED -->
<section id="feed" class="tab">
<h2>News Feed</h2>
<textarea id="postText" placeholder="What's on your mind?"></textarea>
<input id="postImage" placeholder="Image URL (optional)">
<button id="publishPost">Publish Post</button>
<div id="feedList"></div>
</section>

<!-- PEOPLE -->
<section id="people" class="tab hidden">
<h2>Find People</h2>
<div id="peopleList"></div>
</section>

<!-- SEARCH -->
<section id="search" class="tab hidden">
<h2>Search HASSO</h2>
<input id="searchInput" placeholder="Search people or posts">
<button id="searchBtn">Search</button>
<div id="searchResults"></div>
</section>

<!-- NOTIFICATIONS -->
<section id="notifications" class="tab hidden">
<h2>Notifications</h2>
<div id="notificationList"></div>
</section>

<!-- MESSAGES -->
<section id="messages" class="tab hidden">
<h2>Private Messages</h2>
<div id="chatList"></div>
<div id="chatArea">
<p>Select a person to start chatting.</p>
</div>
</section>

<!-- ADMIN -->
<section id="admin" class="tab hidden">
<h2>Admin Dashboard</h2>
<div id="adminContent">
<p>Admin access only.</p>
</div>
</section>

<!-- PROFILE VIEW -->
<section id="profileView">
<button id="backBtn" class="secondary">Back</button>
<div id="profileContent"></div>
<button id="followBtn">Follow</button>
<button id="messageBtn">Message</button>
<button id="reportBtn" class="danger">Report User</button>
<button id="verifyMe">Request Verification</button>
</section>

</div>
</main>
  
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore, doc, setDoc, getDoc, getDocs, addDoc,
  collection, query, where, orderBy, limit, onSnapshot,
  updateDoc, deleteDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCEYjoHliRW1jE1hgu-33QxZmsBYVc25jk",
  authDomain: "hasso-4bc9e.firebaseapp.com",
  projectId: "hasso-4bc9e",
  storageBucket: "hasso-4bc9e.firebasestorage.app",
  messagingSenderId: "150032029282",
  appId: "1:150032029282:web:3d790c6d4ae68b3f50a33b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_UID = "tCML3KjgMMMQY86I3hx1xmdFMNK2";

let currentUser = null;
let currentProfile = null;
let stopFeed = null;
let stopNotifications = null;

const $ = id => document.getElementById(id);

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

function validUrl(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol) ? url.href : "";
  } catch {
    return "";
  }
}

function say(id, message) {
  if ($(id)) $(id).textContent = message;
}

async function notify(to, text, type) {
  if (!to || to === currentUser.uid) return;
  await addDoc(collection(db, "notifications"), {
    to, from: currentUser.uid, text, type,
    createdAt: serverTimestamp(), read: false
  });
}

// REGISTER
$("registerBtn").onclick = async () => {
  const name = $("name").value.trim();
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!name || !email || password.length < 6) {
    return say("authMessage", "Enter your name, email and a password of at least 6 characters.");
  }

  try {
    const result = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, "users", result.user.uid), {
      uid: result.user.uid,
      name,
      email,
      photoURL: "",
      verified: false,
      createdAt: serverTimestamp()
    });
    say("authMessage", "Account created successfully!");
  } catch (error) {
    say("authMessage", error.message);
  }
};

// LOGIN
$("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );
  } catch (error) {
    say("authMessage", error.message);
  }
};

// LOGOUT
$("logoutBtn").onclick = () => signOut(auth);

// AUTH STATE
onAuthStateChanged(auth, async user => {
  currentUser = user;

  if (!user) {
    $("auth").classList.remove("hidden");
    $("app").classList.add("hidden");
    $("logoutBtn").classList.add("hidden");
    if (stopFeed) stopFeed();
    if (stopNotifications) stopNotifications();
    return;
  }

  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");

  const userRef = doc(db, "users", user.uid);
  let userSnap = await getDoc(userRef);

  if (!userSnap.exists()) {
    await setDoc(userRef, {
      uid: user.uid,
      name: user.email.split("@")[0],
      email: user.email,
      photoURL: "",
      verified: false,
      createdAt: serverTimestamp()
    });
    userSnap = await getDoc(userRef);
  }

  const data = userSnap.data();
  $("welcome").textContent = "Welcome, " + data.name;
  $("myEmail").textContent = user.email;
  $("newName").value = data.name || "";
  $("photoUrl").value = data.photoURL || "";

  loadFeed();
  loadNotifications();
  loadPeople();
  checkAdmin();
});

// SAVE PROFILE
$("saveProfile").onclick = async () => {
  const name = $("newName").value.trim();
  const photoURL = validUrl($("photoUrl").value.trim());

  if (!name) return alert("Enter your name.");

  try {
    await updateDoc(doc(db, "users", currentUser.uid), {
      name, photoURL
    });
    $("welcome").textContent = "Welcome, " + name;
    alert("Profile updated!");
  } catch (error) {
    alert(error.message);
  }
};

// NAVIGATION
document.querySelectorAll("[data-tab]").forEach(button => {
  button.onclick = () => {
    document.querySelectorAll(".tab").forEach(tab =>
      tab.classList.add("hidden")
    );
    $("profileView").style.display = "none";
    $(button.dataset.tab).classList.remove("hidden");

    if (button.dataset.tab === "people") loadPeople();
    if (button.dataset.tab === "feed") loadFeed();
    if (button.dataset.tab === "notifications") loadNotifications();
  };
});

// FOLLOW / UNFOLLOW
async function followUser(uid, name) {
  if (!uid || uid === currentUser.uid) return;

  const followingRef = doc(
    db, "users", currentUser.uid, "following", uid
  );
  const followerRef = doc(
    db, "users", uid, "followers", currentUser.uid
  );

  const existing = await getDoc(followingRef);

  if (existing.exists()) {
    await deleteDoc(followingRef);
    await deleteDoc(followerRef);
    alert("You unfollowed " + name);
  } else {
    await setDoc(followingRef, {
      uid, createdAt: serverTimestamp()
    });
    await setDoc(followerRef, {
      uid: currentUser.uid, createdAt: serverTimestamp()
    });
    await notify(uid, "started following you", "follow");
    alert("You are now following " + name);
  }

  loadPeople();
}

// LOAD PEOPLE
async function loadPeople() {
  const box = $("peopleList");
  box.innerHTML = "Loading people...";

  try {
    const result = await getDocs(
      query(collection(db, "users"), limit(50))
    );

    box.innerHTML = "";

    result.forEach(item => {
      const person = item.data();
      if (item.id === currentUser.uid) return;

      const row = document.createElement("div");
      row.className = "user-row";

      const photo = validUrl(person.photoURL);
      row.innerHTML = `
        <img class="avatar" src="${photo || "https://placehold.co/50"}">
        <div>
          <b>${safe(person.name)}</b>
          ${person.verified ? '<span class="badge"> ✓ Verified</span>' : ""}
        </div>
        <button class="follow-action" style="width:auto">View</button>
      `;

      row.querySelector("button").onclick = () =>
        openProfile(item.id);

      box.appendChild(row);
    });
  } catch (error) {
    box.textContent = error.message;
  }
}

// OPEN PROFILE
async function openProfile(uid) {
  try {
    const snap = await getDoc(doc(db, "users", uid));
    if (!snap.exists()) return alert("User not found.");

    currentProfile = { uid, ...snap.data() };

    document.querySelectorAll(".tab").forEach(tab =>
      tab.classList.add("hidden")
    );

    $("profileView").style.display = "block";

    const person = currentProfile;
    const photo = validUrl(person.photoURL);

    $("profileContent").innerHTML = `
      <img class="avatar" src="${photo || "https://placehold.co/70"}">
      <h2>${safe(person.name)}
        ${person.verified ? '<span class="badge">✓ Verified</span>' : ""}
      </h2>
      <p>${safe(person.email || "")}</p>
    `;

    $("followBtn").onclick = () =>
      followUser(uid, person.name);

    $("messageBtn").onclick = () =>
      openChat(uid, person.name);

    $("reportBtn").onclick = async () => {
      const reason = prompt("Why are you reporting this account?");
      if (!reason || !reason.trim()) return;

      await addDoc(collection(db, "reports"), {
        reporterUid: currentUser.uid,
        reportedUid: uid,
        reason: reason.trim(),
        status: "pending",
        createdAt: serverTimestamp()
      });
      alert("Report submitted.");
    };

  } catch (error) {
    alert(error.message);
  }
}

$("backBtn").onclick = () => {
  $("profileView").style.display = "none";
  $("people").classList.remove("hidden");
};

// REQUEST VERIFICATION
$("verifyMe").onclick = async () => {
  try {
    await addDoc(collection(db, "verificationRequests"), {
      uid: currentUser.uid,
      status: "pending",
      createdAt: serverTimestamp()
    });
    alert("Verification request submitted.");
  } catch (error) {
    alert(error.message);
  }
};

// PUBLISH POST
$("publishPost").onclick = async () => {
  const text = $("postText").value.trim();
  const imageURL = validUrl($("postImage").value.trim());

  if (!text && !imageURL) {
    return alert("Write something or add an image.");
  }

  try {
    const userSnap = await getDoc(doc(db, "users", currentUser.uid));
    const user = userSnap.data();

    await addDoc(collection(db, "posts"), {
      ownerId: currentUser.uid,
      ownerName: user.name,
      ownerPhoto: user.photoURL || "",
      text,
      imageURL,
      createdAt: serverTimestamp()
    });

    $("postText").value = "";
    $("postImage").value = "";
    alert("Post published!");
  } catch (error) {
    alert(error.message);
  }
};

// LOAD FEED
function loadFeed() {
  if (stopFeed) stopFeed();

  const q = query(
    collection(db, "posts"),
    orderBy("createdAt", "desc"),
    limit(50)
  );

  stopFeed = onSnapshot(q, snapshot => {
    const box = $("feedList");
    box.innerHTML = "";

    snapshot.forEach(postDoc => {
      const post = postDoc.data();
      const postId = postDoc.id;
      const image = validUrl(post.imageURL);

      const item = document.createElement("div");
      item.className = "post";

      item.innerHTML = `
        <b>${safe(post.ownerName)}</b>
        <p>${safe(post.text)}</p>
        ${image ? `<img src="${image}" alt="Post image">` : ""}
        <button class="likeBtn">Like</button>
        <button class="commentBtn secondary">Comment</button>
        <div class="comments"></div>
      `;

      item.querySelector(".likeBtn").onclick = () =>
        toggleLike(postId, post.ownerId);

      item.querySelector(".commentBtn").onclick = () =>
        addComment(postId, post.ownerId);

      box.appendChild(item);
      loadComments(postId, item.querySelector(".comments"));
    });
  }, error => {
    $("feedList").textContent = error.message;
  });
}

// LIKE / UNLIKE
async function toggleLike(postId, ownerId) {
  const likeRef = doc(
    db, "posts", postId, "likes", currentUser.uid
  );

  const existing = await getDoc(likeRef);

  if (existing.exists()) {
    await deleteDoc(likeRef);
  } else {
    await setDoc(likeRef, {
      uid: currentUser.uid,
      createdAt: serverTimestamp()
    });
    await notify(ownerId, "liked your post", "like");
  }
}

// ADD COMMENT
async function addComment(postId, ownerId) {
  const text = prompt("Write your comment:");
  if (!text || !text.trim()) return;

  const userSnap = await getDoc(doc(db, "users", currentUser.uid));
  const user = userSnap.data();

  await addDoc(
    collection(db, "posts", postId, "comments"),
    {
      uid: currentUser.uid,
      name: user.name,
      text: text.trim(),
      createdAt: serverTimestamp()
    }
  );

  await notify(ownerId, "commented on your post", "comment");
}

// LOAD COMMENTS
function loadComments(postId, box) {
  const q = query(
    collection(db, "posts", postId, "comments"),
    orderBy("createdAt", "asc"),
    limit(30)
  );

  onSnapshot(q, snapshot => {
    box.innerHTML = "";
    snapshot.forEach(comment => {
      const data = comment.data();
      const p = document.createElement("p");
      p.textContent = data.name + ": " + data.text;
      box.appendChild(p);
    });
  });
}

// NOTIFICATIONS
function loadNotifications() {
  if (stopNotifications) stopNotifications();

  const q = query(
    collection(db, "notifications"),
    where("to", "==", currentUser.uid),
    limit(50)
  );

  stopNotifications = onSnapshot(q, snapshot => {
    const box = $("notificationList");
    box.innerHTML = "";

    snapshot.forEach(item => {
      const data = item.data();
      const p = document.createElement("p");
      p.textContent = data.text || "New notification";
      box.appendChild(p);
    });

    if (snapshot.empty) {
      box.textContent = "No notifications yet.";
    }
  }, error => {
    $("notificationList").textContent = error.message;
  });
}

// SEARCH PEOPLE AND POSTS
$("searchBtn").onclick = async () => {
  const term = $("searchInput").value.trim().toLowerCase();
  const box = $("searchResults");
  box.innerHTML = "Searching...";

  if (!term) {
    box.textContent = "Enter a search term.";
    return;
  }

  try {
    const [users, posts] = await Promise.all([
      getDocs(query(collection(db, "users"), limit(100))),
      getDocs(query(collection(db, "posts"), limit(100)))
    ]);

    box.innerHTML = "<h3>People</h3>";

    users.forEach(item => {
      const data = item.data();
      if ((data.name || "").toLowerCase().includes(term)) {
        const button = document.createElement("button");
        button.textContent = data.name;
        button.onclick = () => openProfile(item.id);
        box.appendChild(button);
      }
    });

    const heading = document.createElement("h3");
    heading.textContent = "Posts";
    box.appendChild(heading);

    posts.forEach(item => {
      const data = item.data();
      if ((data.text || "").toLowerCase().includes(term)) {
        const p = document.createElement("p");
        p.textContent = data.ownerName + ": " + data.text;
        box.appendChild(p);
      }
    });
  } catch (error) {
    box.textContent = error.message;
  }
};


 // ===============================
 // PART 3: PRIVATE MESSAGING
 // ===============================

let activeChat = null;
let stopChatMessages = null;
let stopChatList = null;

async function openChat(uid, name) {
  if (!currentUser || uid === currentUser.uid) return;

  const participants = [currentUser.uid, uid].sort();
  activeChat = participants.join("_");

  try {
    await setDoc(doc(db, "chats", activeChat), {
      participants,
      updatedAt: serverTimestamp()
    }, { merge: true });

    $("messages").classList.remove("hidden");
$("profileView").style.display = "none";
    $("chatArea").innerHTML = `
      <h3>Chat with ${safe(name)}</h3>
      <div id="chatMessages" style="max-height:300px;overflow:auto"></div>
      <textarea id="messageText" placeholder="Write a message..."></textarea>
      <button id="sendMessage">Send Message</button>
    `;

    if (stopChatMessages) stopChatMessages();

    const messagesQuery = query(
      collection(db, "chats", activeChat, "messages"),
      orderBy("createdAt", "asc"),
      limit(100)
    );

    stopChatMessages = onSnapshot(messagesQuery, snapshot => {
      const box = $("chatMessages");
      box.innerHTML = "";

      snapshot.forEach(messageDoc => {
        const message = messageDoc.data();
        const p = document.createElement("p");
        p.textContent =
          (message.senderUid === currentUser.uid ? "You: " : name + ": ") +
          (message.text || "");
        box.appendChild(p);
      });

      box.scrollTop = box.scrollHeight;
    }, error => {
      $("chatMessages").textContent = error.message;
    });

    $("sendMessage").onclick = async () => {
      const text = $("messageText").value.trim();
      if (!text) return;

      try {
        await addDoc(
          collection(db, "chats", activeChat, "messages"),
          {
            senderUid: currentUser.uid,
            text,
            createdAt: serverTimestamp()
          }
        );

        await updateDoc(doc(db, "chats", activeChat), {
          updatedAt: serverTimestamp()
        });

        $("messageText").value = "";
      } catch (error) {
        alert(error.message);
      }
    };
  } catch (error) {
    alert(error.message);
  }
}

// LOAD CHAT LIST
function loadChats() {
  if (stopChatList) stopChatList();

  const q = query(
    collection(db, "chats"),
    where("participants", "array-contains", currentUser.uid),
    limit(50)
  );

  stopChatList = onSnapshot(q, async snapshot => {
    const box = $("chatList");
    box.innerHTML = "";

    for (const chatDoc of snapshot.docs) {
      const data = chatDoc.data();
      const otherUid = data.participants.find(
        uid => uid !== currentUser.uid
      );

      if (!otherUid) continue;

      const userSnap = await getDoc(doc(db, "users", otherUid));
      if (!userSnap.exists()) continue;

      const person = userSnap.data();
      const button = document.createElement("button");
      button.textContent = "Chat with " + person.name;
      button.onclick = () => openChat(otherUid, person.name);
      box.appendChild(button);
    }

    if (snapshot.empty) {
      box.textContent = "No conversations yet.";
    }
  }, error => {
    box.textContent = error.message;
  });
}

// MESSAGES TAB
document.querySelector('[data-tab="messages"]').onclick = () => {
  document.querySelectorAll(".tab").forEach(tab =>
    tab.classList.add("hidden")
  );
  $("profileView").style.display = "none";
  $("messages").classList.remove("hidden");
  loadChats();
};

// ===============================
// ADMIN DASHBOARD
// ===============================

async function isAdmin() {
  if (!currentUser) return false;

  if (currentUser.uid === ADMIN_UID) return true;

  const adminSnap = await getDoc(
    doc(db, "admins", currentUser.uid)
  );

  return adminSnap.exists() &&
    adminSnap.data().role === "admin";
}

async function loadAdminDashboard() {
  if (!await isAdmin()) {
    $("adminContent").textContent = "Admin access only.";
    return;
  }

  $("adminContent").innerHTML = `
    <h3>Users</h3>
    <div id="adminUsers">Loading...</div>
    <hr>
    <h3>Verification Requests</h3>
    <div id="adminVerifications">Loading...</div>
    <hr>
    <h3>Reports</h3>
    <div id="adminReports">Loading...</div>
  `;

  try {
    // USERS
    const users = await getDocs(
      query(collection(db, "users"), limit(100))
    );

    $("adminUsers").innerHTML = "";

    users.forEach(userDoc => {
      const user = userDoc.data();
      const row = document.createElement("p");
      row.textContent =
        (user.name || "Unknown") +
        (user.verified ? " ✓ Verified" : "");
      $("adminUsers").appendChild(row);
    });

    // VERIFICATION REQUESTS
    const requests = await getDocs(
      query(
        collection(db, "verificationRequests"),
        where("status", "==", "pending"),
        limit(50)
      )
    );

    $("adminVerifications").innerHTML = "";

    requests.forEach(requestDoc => {
      const request = requestDoc.data();
      const row = document.createElement("div");
      row.className = "post";

      const text = document.createElement("p");
      text.textContent = "User UID: " + request.uid;

      const approve = document.createElement("button");
      approve.textContent = "Approve Verification";

      approve.onclick = async () => {
        if (!await isAdmin()) return alert("Admin only.");

        try {
          await updateDoc(doc(db, "users", request.uid), {
            verified: true
          });

          await updateDoc(
            doc(db, "verificationRequests", requestDoc.id),
            { status: "approved" }
          );

          alert("Verification approved.");
          loadAdminDashboard();
        } catch (error) {
          alert(error.message);
        }
      };

      const reject = document.createElement("button");
      reject.textContent = "Reject Request";
      reject.className = "danger";

      reject.onclick = async () => {
        if (!await isAdmin()) return alert("Admin only.");

        try {
          await updateDoc(
            doc(db, "verificationRequests", requestDoc.id),
            { status: "rejected" }
          );

          alert("Request rejected.");
          loadAdminDashboard();
        } catch (error) {
          alert(error.message);
        }
      };

      row.append(text, approve, reject);
      $("adminVerifications").appendChild(row);
    });

    if (requests.empty) {
      $("adminVerifications").textContent =
        "No pending verification requests.";
    }

    // REPORTS
    const reports = await getDocs(
      query(
        collection(db, "reports"),
        where("status", "==", "pending"),
        limit(50)
      )
    );

    $("adminReports").innerHTML = "";

    reports.forEach(reportDoc => {
      const report = reportDoc.data();
      const row = document.createElement("div");
      row.className = "post";

      const details = document.createElement("p");
      details.textContent =
        "Reported UID: " + report.reportedUid +
        " | Reason: " + report.reason;

      const resolve = document.createElement("button");
      resolve.textContent = "Mark as Reviewed";

      resolve.onclick = async () => {
        if (!await isAdmin()) return alert("Admin only.");

        try {
          await updateDoc(
            doc(db, "reports", reportDoc.id),
            { status: "reviewed" }
          );

          alert("Report reviewed.");
          loadAdminDashboard();
        } catch (error) {
          alert(error.message);
        }
      };

      row.append(details, resolve);
      $("adminReports").appendChild(row);
    });

    if (reports.empty) {
      $("adminReports").textContent = "No pending reports.";
    }

  } catch (error) {
    $("adminContent").textContent = error.message;
  }
}

// ADMIN TAB
document.querySelector('[data-tab="admin"]').onclick = () => {
  document.querySelectorAll(".tab").forEach(tab =>
    tab.classList.add("hidden")
  );

  $("profileView").style.display = "none";
  $("admin").classList.remove("hidden");
  loadAdminDashboard();
};


// ADMIN CHECK
async function checkAdmin() {
  const adminSnap = await getDoc(doc(db, "admins", currentUser.uid));

  if (currentUser.uid === ADMIN_UID || adminSnap.exists()) {
    $("adminContent").innerHTML =
      "<p>Admin account detected. Full dashboard will be added in Part 3.</p>";
  } else {
    $("adminContent").textContent = "Admin access only.";
  }
}

</script>
