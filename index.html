
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASSO - Social Media</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f0f2f5;color:#172033}
header{background:#102b59;color:white;padding:18px;font-size:28px;font-weight:bold}
.hero{text-align:center;padding:70px 15px;background:linear-gradient(130deg,#102b59,#2875db);color:white}
.hero h1{font-size:42px}
.hero p{font-size:17px}
button{padding:13px 25px;border:0;border-radius:8px;background:white;color:#102b59;font-weight:bold}
.cards{max-width:850px;margin:30px auto;padding:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}
.card{background:white;padding:25px;border-radius:12px;text-align:center}
footer{text-align:center;background:#102b59;color:white;padding:20px}
</style>
</head>
<body>
<header>HASSO</header>
<section class="hero">
<h1>Welcome to HASSO</h1>
<p>Connect. Share. Belong.</p>
<button onclick="alert('HASSO is coming soon!')">Join HASSO</button>
</section>
<section class="cards">
<div class="card"><h2>👥 Friends</h2><p>Connect with people.</p></div>
<div class="card"><h2>📝 Posts</h2><p>Share your moments.</p></div>
<div class="card"><h2>💬 Messages</h2><p>Stay connected.</p></div>
</section>
<footer>© 2026 HASSO</footer>
</body>
</html>
